<!DOCTYPE html>
<html>
<head>
    <title>CSS3 Font Property - 종합 예제</title>
    <style>
        /* 1. font-size 예제 스타일 (코드 6-24) */
        .a { font-size: 32px; }
        .b { font-size: 2em; }
        .c { font-size: large; }
        .d { font-size: small; }

        /* 2. font-family 지정 (코드 6-25) */
        .font_arial { font-family: Arial; }
        .font_roman { font-family: 'Times New Roman'; }

        /* 3. 글꼴 여러 개 지정 (코드 6-26) */
        .font_fallback_arial { font-family: '없는 글꼴', Arial; }
        .font_fallback_roman { font-family: 'Times New Roman', Arial; }

        /* 4. 웹 브라우저 고유 글꼴 적용 (코드 6-27) */
        .font_generic_sans { font-family: '없는 글꼴', sans-serif; }
        .font_generic_serif { font-family: '없는 글꼴', serif; }

        /* 구분용 레이아웃 스타일 */
        section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 5px;
            margin-top: 0;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- 코드 6-24: font-size -->
    <section>
        <h2>1. 글자 크기 (font-size) 예제 [코드 6-24]</h2>
        <h1>Lorem ipsum</h1>
        <p class="a">Lorem ipsum</p>
        <p class="b">Lorem ipsum</p>
        <p class="c">Lorem ipsum</p>
        <p class="d">Lorem ipsum</p>
    </section>

    <!-- 코드 6-25: font-family 1개 지정 -->
    <section>
        <h2>2. 글꼴 1개 지정 (font-family) 예제 [코드 6-25]</h2>
        <h1 class="font_arial">Lorem ipsum</h1>
        <p class="font_roman">Lorem ipsum</p>
    </section>

    <!-- 코드 6-26: 글꼴 여러 개 지정 (Fallback) -->
    <section>
        <h2>3. 글꼴 여러 개 지정 (Fallback) 예제 [코드 6-26]</h2>
        <h1 class="font_fallback_arial">Lorem ipsum</h1>
        <p class="font_fallback_roman">Lorem ipsum</p>
    </section>

    <!-- 코드 6-27: 웹 브라우저 고유 글꼴 적용 -->
    <section>
        <h2>4. 웹 브라우저 고유 글꼴 적용 예제 [코드 6-27]</h2>
        <h1 class="font_generic_sans">Lorem ipsum</h1>
        <p class="font_generic_serif">Lorem ipsum</p>
    </section>

</body>
</html>
